services:
  postgres:
    image: postgres:17-alpine
    container_name: supermarket-tracker-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supermarket_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-supermarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supermarket}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    container_name: supermarket-tracker-api
    environment:
      # O banco do próprio Compose não exige SSL; produção deve sobrescrever para `prod`.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # A API do Compose sempre conversa com o PostgreSQL do próprio Compose.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-supermarket_tracker}
      DB_USERNAME: ${POSTGRES_USER:-supermarket}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-supermarket}
      # JWT - secret para autenticação
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      # Mercado Pago - access token para PIX e Cartão
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      PIX_MERCADOPAGO_ACCESS_TOKEN: ${PIX_MERCADOPAGO_ACCESS_TOKEN}
      CARTAO_PROVIDER: ${CARTAO_PROVIDER}
      # E-mail SMTP
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      EMAIL_FROM: ${EMAIL_FROM}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
