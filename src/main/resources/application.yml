spring:
  application:
    name: supermarket-tracker
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  jwt:
    secret: ${APP_JWT_SECRET:supermarket-tracker-dev-secret-change-me-32}
    access-ttl-minutes: 15
    refresh-ttl-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
