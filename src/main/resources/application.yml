spring:
  application:
    name: supermarket-tracker
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  pix:
    mock-enabled: ${PIX_MOCK_ENABLED:true}
    mercadopago:
      access-token: ${PIX_MERCADOPAGO_ACCESS_TOKEN:}
      base-url: https://api.mercadopago.com
  cartao:
    provider: ${CARTAO_PROVIDER:mercadopago}
  mercadopago:
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    base-url: https://api.mercadopago.com
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
  email:
    provider: ${EMAIL_PROVIDER:smtp}
    from: ${EMAIL_FROM:noreply@supermarkettracker.com.br}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true