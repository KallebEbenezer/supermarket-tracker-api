<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Supermarket Tracker — gestão de vendas, estoque e caixa para supermercados.">
    <title>Supermarket Tracker</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; color: #16351f; background: #f6f8f6; }
      body { margin: 0; }
      main { max-width: 760px; margin: 12vh auto; padding: 40px; }
      section { background: #fff; border-radius: 18px; padding: 40px; box-shadow: 0 8px 30px #0002; }
      h1 { margin: 0 0 16px; color: #1b5e20; font-size: clamp(2rem, 7vw, 3.5rem); }
      p { font-size: 1.15rem; line-height: 1.6; }
      small { color: #55705d; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Supermarket Tracker</h1>
        <p>Aplicativo de gestão para supermercados, reunindo vendas, caixa, estoque e formas de pagamento em um só lugar.</p>
        <p class="contact">Contato: <a href="https://github.com/KallebEbenezer/supermarket-tracker-api/issues">suporte pelo projeto</a>.</p>
        <small>Plataforma de gestão comercial.</small>
      </section>
    </main>
  </body>
</html>
