spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:supermarket_tracker}
    username: ${DB_USERNAME:supermarket}
    password: ${DB_PASSWORD:supermarket}
  jpa:
    show-sql: true

# ⚠️ Secret fixo APENAS para desenvolvimento local.
app:
  jwt:
    secret: ${APP_JWT_SECRET:supermarket-tracker-dev-secret-change-me-32}
  pix:
    mock-enabled: true

logging:
  level:
    org.hibernate.SQL: debug
